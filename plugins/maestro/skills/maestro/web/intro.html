<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maestro</title>
  <link rel="icon" type="image/png" href="fox.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="intro.css">
</head>
<body>
  <main class="stage" aria-label="Maestro intro">
    <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <filter id="grainFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
        <feColorMatrix type="saturate" values="0"></feColorMatrix>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainFilter)"></rect>
    </svg>

    <div class="glow glow-primary" aria-hidden="true"></div>
    <div class="glow glow-secondary" aria-hidden="true"></div>

    <figure class="fox-wrap">
      <img class="fox" src="fox-full.webp" alt="" decoding="async" fetchpriority="high">
      <span class="sweep" aria-hidden="true"></span>
    </figure>

    <div class="copy">
      <h1 class="wordmark">Maestro</h1>
      <p class="sub">AI Orchestra</p>
      <p class="credit">by foxxiee</p>
    </div>

    <button class="skip" type="button">Bỏ qua</button>

    <div class="progress" aria-hidden="true">
      <span class="progress-bar"></span>
    </div>
  </main>

  <script src="intro.js" defer></script>
</body>
</html>
